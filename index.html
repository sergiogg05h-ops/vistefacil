
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistefacil | Catálogo de Moda y Ropa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#0f172a',
                            light: '#1e293b',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="bg-slate-900 text-white p-2.5 rounded-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-shirt text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-tight text-slate-900">VISTEFACIL</span>
                    <span class="block text-xs font-medium text-slate-500 uppercase tracking-widest">Moda & Estilo</span>
                </div>
            </div>

            <!-- Search Bar Header -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Buscar prendas, abrigos, sudaderas..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-transparent rounded-full text-sm focus:outline-none focus:bg-white focus:border-slate-300 transition">
                </div>
            </div>

            <!-- Actions / Cart -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative p-2.5 text-slate-700 hover:bg-slate-100 rounded-full transition flex items-center space-x-2">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cartCount" class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Search Bar -->
    <div class="md:hidden px-4 py-3 bg-white border-b border-slate-200">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInputMobile" placeholder="Buscar prendas..." 
                class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-transparent rounded-full text-sm focus:outline-none focus:bg-white focus:border-slate-300 transition">
        </div>
    </div>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Sidebar Filters -->
            <aside class="w-full lg:w-72 flex-shrink-0">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm sticky top-28 space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <h2 class="font-bold text-lg text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-filter text-blue-600"></i> Filtros
                        </h2>
                        <button onclick="resetFilters()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold transition">
                            Limpiar todo
                        </button>
                    </div>

                    <!-- Category Filter -->
                    <div>
                        <h3 class="font-semibold text-sm text-slate-900 mb-3">Tipo de Prenda</h3>
                        <div id="categoryFilters" class="space-y-2">
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="todos" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Todas las prendas</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="Abrigos" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Abrigos y Chaquetas</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="Sudaderas" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Sudaderas</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="Pantalones" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Pantalones y Vaqueros</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="Camisetas" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Camisetas</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="category" value="Zapatillas" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Zapatillas</span>
                            </label>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Size Filter -->
                    <div>
                        <h3 class="font-semibold text-sm text-slate-900 mb-3">Talla</h3>
                        <div id="sizeFilters" class="grid grid-cols-3 gap-2">
                            <button onclick="toggleFilter(this, 'size')" data-value="XS" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">XS</button>
                            <button onclick="toggleFilter(this, 'size')" data-value="S" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">S</button>
                            <button onclick="toggleFilter(this, 'size')" data-value="M" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">M</button>
                            <button onclick="toggleFilter(this, 'size')" data-value="L" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">L</button>
                            <button onclick="toggleFilter(this, 'size')" data-value="XL" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">XL</button>
                            <button onclick="toggleFilter(this, 'size')" data-value="XXL" class="filter-btn-size py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:border-slate-400 transition">XXL</button>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Color Filter -->
                    <div>
                        <h3 class="font-semibold text-sm text-slate-900 mb-3">Color</h3>
                        <div id="colorFilters" class="flex flex-wrap gap-2">
                            <button onclick="toggleFilter(this, 'color')" data-value="Negro" title="Negro" class="w-7 h-7 rounded-full bg-slate-900 border-2 border-transparent hover:scale-110 transition shadow-sm"></button>
                            <button onclick="toggleFilter(this, 'color')" data-value="Blanco" title="Blanco" class="w-7 h-7 rounded-full bg-white border-2 border-slate-300 hover:scale-110 transition shadow-sm"></button>
                            <button onclick="toggleFilter(this, 'color')" data-value="Gris" title="Gris" class="w-7 h-7 rounded-full bg-slate-400 border-2 border-transparent hover:scale-110 transition shadow-sm"></button>
                            <button onclick="toggleFilter(this, 'color')" data-value="Azul" title="Azul" class="w-7 h-7 rounded-full bg-blue-600 border-2 border-transparent hover:scale-110 transition shadow-sm"></button>
                            <button onclick="toggleFilter(this, 'color')" data-value="Beige" title="Beige" class="w-7 h-7 rounded-full bg-amber-200 border-2 border-transparent hover:scale-110 transition shadow-sm"></button>
                            <button onclick="toggleFilter(this, 'color')" data-value="Verde" title="Verde" class="w-7 h-7 rounded-full bg-emerald-700 border-2 border-transparent hover:scale-110 transition shadow-sm"></button>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Material Filter -->
                    <div>
                        <h3 class="font-semibold text-sm text-slate-900 mb-3">Material</h3>
                        <div id="materialFilters" class="space-y-2">
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Algodón" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Algodón</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Lana" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Lana</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Cuero" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Cuero</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Vaquero" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Mezclilla / Vaquero</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Poliéster" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Poliéster</span>
                            </label>
                            <label class="flex items-center space-x-3 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" name="material" value="Lino" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span>Lino</span>
                            </label>
                        </div>
                    </div>

                </div>
            </aside>

            <!-- Product Catalog Grid -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-bold text-slate-900">Catálogo de Prendas (<span id="productCount">0</span>)</h1>
                </div>

                <!-- Products Grid -->
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic products injected here -->
                </div>

                <!-- Empty State -->
                <div id="noResults" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 mt-4">
                    <i class="fa-solid fa-shirt text-4xl text-slate-300 mb-3"></i>
                    <h3 class="text-lg font-bold text-slate-800">No se encontraron prendas</h3>
                    <p class="text-slate-500 text-sm mt-1">Prueba a cambiar los filtros o los términos de búsqueda.</p>
                    <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition">
                        Restablecer filtros
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            &copy; 2026 Vistefacil. Todos los derechos reservados.
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const products = [
            { id: 1, name: "Abrigo Oversize de Lana", category: "Abrigos", price: 129.99, size: ["M", "L", "XL"], color: "Negro", material: "Lana", image: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=600&auto=format&fit=crop&q=60" },
            { id: 2, name: "Sudadera Minimalista con Capucha", category: "Sudaderas", price: 49.99, size: ["S", "M", "L", "XL"], color: "Gris", material: "Algodón", image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=600&auto=format&fit=crop&q=60" },
            { id: 3, name: "Pantalón Chino Casual", category: "Pantalones", price: 39.99, size: ["S", "M", "L"], color: "Beige", material: "Algodón", image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=600&auto=format&fit=crop&q=60" },
            { id: 4, name: "Camiseta Básica Premium", category: "Camisetas", price: 19.99, size: ["XS", "S", "M", "L", "XL"], color: "Blanco", material: "Algodón", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&auto=format&fit=crop&q=60" },
            { id: 5, name: "Chaqueta Biker de Cuero", category: "Abrigos", price: 189.99, size: ["M", "L"], color: "Negro", material: "Cuero", image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop&q=60" },
            { id: 6, name: "Vaqueros Slim Fit Denim", category: "Pantalones", price: 59.99, size: ["S", "M", "L", "XL", "XXL"], color: "Azul", material: "Vaquero", image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600&auto=format&fit=crop&q=60" },
            { id: 7, name: "Zapatillas Urbanas Blancas", category: "Zapatillas", price: 79.99, size: ["40", "42", "43", "44"], color: "Blanco", material: "Poliéster", image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600&auto=format&fit=crop&q=60" },
            { id: 8, name: "Sudadera Deportiva", category: "Sudaderas", price: 54.99, size: ["M", "L", "XL"], color: "Azul", material: "Poliéster", image: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&auto=format&fit=crop&q=60" },
            { id: 9, name: "Camisa de Lino Veraniega", category: "Camisetas", price: 45.00, size: ["S", "M", "L", "XL"], color: "Beige", material: "Lino", image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600&auto=format&fit=crop&q=60" },
            { id: 10, name: "Chaqueta Bomber Verde", category: "Abrigos", price: 89.99, size: ["S", "M", "L"], color: "Verde", material: "Poliéster", image: "https://images.unsplash.com/photo-1548883354-7622d03aca27?w=600&auto=format&fit=crop&q=60" }
        ];

        let selectedSizes = [];
        let selectedColors = [];
        let cartCount = 0;

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');
            const searchVal = (document.getElementById('searchInput').value || document.getElementById('searchInputMobile').value).toLowerCase();
            
            // Get selected category
            const categoryChecked = document.querySelector('input[name="category"]:checked');
            const selectedCategory = categoryChecked ? categoryChecked.value : 'todos';

            // Get selected materials
            const materialChecked = Array.from(document.querySelectorAll('input[name="material"]:checked')).map(el => el.value);

            const filtered = products.filter(p => {
                // Search filter
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.category.toLowerCase().includes(searchVal);
                
                // Category filter
                const matchesCategory = selectedCategory === 'todos' || p.category === selectedCategory;

                // Size filter
                const matchesSize = selectedSizes.length === 0 || p.size.some(s => selectedSizes.includes(s));

                // Color filter
                const matchesColor = selectedColors.length === 0 || selectedColors.includes(p.color);

                // Material filter
                const matchesMaterial = materialChecked.length === 0 || materialChecked.includes(p.material);

                return matchesSearch && matchesCategory && matchesSize && matchesColor && matchesMaterial;
            });

            document.getElementById('productCount').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col group">
                    <div class="relative overflow-hidden aspect-[4/5] bg-slate-100">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-slate-900 text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                            ${p.category}
                        </span>
                    </div>
                    <div class="p-5 flex flex-col flex-1 justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-slate-900 text-base">${p.name}</h3>
                                <span class="font-black text-blue-600 text-base">${p.price.toFixed(2)}€</span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-slate-500 mt-2">
                                <span class="bg-slate-100 px-2 py-0.5 rounded font-medium">Color: ${p.color}</span>
                                <span class="bg-slate-100 px-2 py-0.5 rounded font-medium">Mat: ${p.material}</span>
                            </div>
                        </div>
                        <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
                            <div class="flex gap-1">
                                ${p.size.map(s => `<span class="text-[10px] font-bold border border-slate-200 rounded px-1.5 py-0.5 text-slate-600">${s}</span>`).join('')}
                            </div>
                            <button onclick="addToCart()" class="bg-slate-900 hover:bg-blue-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus"></i> Añadir
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleFilter(btn, type) {
            const val = btn.getAttribute('data-value');
            if (type === 'size') {
                if (selectedSizes.includes(val)) {
                    selectedSizes = selectedSizes.filter(s => s !== val);
                    btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                    btn.classList.add('border-slate-200', 'text-slate-600');
                } else {
                    selectedSizes.push(val);
                    btn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
                    btn.classList.remove('border-slate-200', 'text-slate-600');
                }
            } else if (type === 'color') {
                if (selectedColors.includes(val)) {
                    selectedColors = selectedColors.filter(c => c !== val);
                    btn.classList.remove('ring-4', 'ring-blue-400');
                } else {
                    selectedColors.push(val);
                    btn.classList.add('ring-4', 'ring-blue-400');
                }
            }
            renderProducts();
        }

        function resetFilters() {
            document.querySelector('input[name="category"][value="todos"]').checked = true;
            document.querySelectorAll('input[name="material"]').forEach(el => el.checked = false);
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInputMobile').value = '';
            selectedSizes = [];
            selectedColors = [];
            document.querySelectorAll('.filter-btn-size').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                btn.classList.add('border-slate-200', 'text-slate-600');
            });
            document.querySelectorAll('#colorFilters button').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-blue-400');
            });
            renderProducts();
        }

        function addToCart() {
            cartCount++;
            document.getElementById('cartCount').textContent = cartCount;
        }

        function toggleCart() {
            alert(`Tienes ${cartCount} prenda(s) seleccionadas en tu cesta de Vistefacil.`);
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', renderProducts);
        document.getElementById('searchInputMobile').addEventListener('input', renderProducts);
        document.querySelectorAll('input[name="category"]').forEach(el => el.addEventListener('change', renderProducts));
        document.querySelectorAll('input[name="material"]').forEach(el => el.addEventListener('change', renderProducts));

        // Initial render
        renderProducts();
    </script>
</body>
</html>
